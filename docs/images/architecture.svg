<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" role="img" aria-label="DSH Remote 架构图">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="mac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#ffffff"/>
  <text x="440" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">DSH Remote · 手机随时连回电脑上的 DeepSeek Harness</text>
  <text x="440" y="66" text-anchor="middle" font-size="13" fill="#64748b">隧道由电脑主动向外建立：不需要公网 IP、不改路由器、换网也不影响</text>

  <!-- 手机 -->
  <g>
    <rect x="40" y="110" width="230" height="150" rx="14" fill="url(#phone)" stroke="#6366f1" stroke-width="1.6"/>
    <text x="155" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">手机</text>
    <text x="155" y="164" text-anchor="middle" font-size="12.5" fill="#3730a3">浏览器 / DSH Remote App</text>
    <text x="155" y="186" text-anchor="middle" font-size="12.5" fill="#3730a3">4G · 公司网 · 任何 WiFi</text>
    <rect x="70" y="202" width="170" height="42" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="155" y="220" text-anchor="middle" font-size="11.5" fill="#4338ca">一次性 8 位配对码</text>
    <text x="155" y="236" text-anchor="middle" font-size="11.5" fill="#4338ca">→ 180 天 HttpOnly cookie</text>
  </g>

  <!-- 服务器 -->
  <g>
    <rect x="325" y="110" width="230" height="150" rx="14" fill="url(#cloud)" stroke="#16a34a" stroke-width="1.6"/>
    <text x="440" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">relay（公网服务器）</text>
    <text x="440" y="164" text-anchor="middle" font-size="12.5" fill="#166534">nginx + Let's Encrypt（443）</text>
    <text x="440" y="186" text-anchor="middle" font-size="12.5" fill="#166534">HTTP/WS 多路复用 · 配对 · 离线页</text>
    <rect x="355" y="202" width="170" height="42" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="440" y="220" text-anchor="middle" font-size="11.5" fill="#15803d">只监听 127.0.0.1:8848</text>
    <text x="440" y="236" text-anchor="middle" font-size="11.5" fill="#15803d">鉴权只在这一层做</text>
  </g>

  <!-- Mac -->
  <g>
    <rect x="610" y="110" width="230" height="150" rx="14" fill="url(#mac)" stroke="#dc2626" stroke-width="1.6"/>
    <text x="725" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">你的 Mac</text>
    <text x="725" y="164" text-anchor="middle" font-size="12.5" fill="#991b1b">agent（LaunchAgent 常驻）</text>
    <text x="725" y="186" text-anchor="middle" font-size="12.5" fill="#991b1b">dsh-pocket → DSH GUI</text>
    <rect x="640" y="202" width="170" height="42" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="725" y="220" text-anchor="middle" font-size="11.5" fill="#b91c1c">127.0.0.1:3081</text>
    <text x="725" y="236" text-anchor="middle" font-size="11.5" fill="#b91c1c">不出公网</text>
  </g>

  <!-- 连线：手机 → 服务器 -->
  <line x1="270" y1="170" x2="320" y2="170" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="295" y="158" text-anchor="middle" font-size="10.5" fill="#475569">HTTPS</text>
  <text x="295" y="188" text-anchor="middle" font-size="10.5" fill="#475569">WSS</text>

  <!-- 连线：服务器 → Mac（浏览器流量方向） -->
  <line x1="555" y1="150" x2="605" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="580" y="140" text-anchor="middle" font-size="10.5" fill="#475569">复用</text>

  <!-- 连线：Mac → 服务器（出站隧道，反向；绕到下方避免压住框内文字） -->
  <path d="M 700 262 C 700 296, 664 298, 620 298 L 500 298 C 456 298, 440 286, 440 264" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <text x="575" y="318" text-anchor="middle" font-size="10.5" fill="#0369a1">出站 WSS（电脑主动连，NAT 穿透）</text>

  <!-- 说明块 -->
  <g>
    <rect x="40" y="330" width="800" height="196" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="64" y="360" font-size="14" font-weight="700" fill="#0f172a">为什么是这个形状</text>

    <text x="64" y="390" font-size="12.5" fill="#334155">· 隧道由 Mac 主动向外建立，服务器只是接入口；家里没有公网 IP、路由器不用动。</text>
    <text x="64" y="414" font-size="12.5" fill="#334155">· 透传的是 GUI 的 HTTP + WebSocket，不是远程桌面、也不是截图流——切工作区、终端、审批都在。</text>
    <text x="64" y="438" font-size="12.5" fill="#334155">· 多绕一层 dsh-pocket：移动端布局、Host/Origin 栅栏、launch-token 握手它已经做好了，relay 只搬字节。</text>
    <text x="64" y="462" font-size="12.5" fill="#334155">· relay 统一把 Host / Origin 改写成 loopback，pocket 与 DSH 的安全栅栏都按「本机访问」放行，鉴权单点收敛。</text>
    <text x="64" y="486" font-size="12.5" fill="#334155">· 配对链接是钥匙：一次性、有期限、用掉即换；手机 cookie 等于能在这台 Mac 上执行代码，别外传。</text>
    <text x="64" y="510" font-size="12.5" fill="#94a3b8">仓库里所有域名、IP、密钥都是占位符——部署时由你自己的配置替换。</text>
  </g>
</svg>
